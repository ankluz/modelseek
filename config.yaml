server:
  cache_ttl_seconds: 900
  request_timeout_seconds: 10
  per_source_limit: 24
  user_agent: "modelseek/1.0 (local model search)"
  data_dir: data
  # Имена, по которым можно открывать modelseek, кроме 127.0.0.1 и localhost
  allowed_hosts: []

breaker:
  max_failures: 3
  cooldown_minutes: 10

ranking:
  weights:
    relevance: 0.40
    semantic: 0.15
    source_rank: 0.15
    popularity: 0.20
    freshness: 0.05
    personal: 0.05
  freshness_half_life_days: 365
  downloads_factor: 0.3
  dedupe: true
  dedupe_images: false

semantic:
  enabled: false
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

translate:
  enabled: false
  url: http://127.0.0.1:11434/v1
  model: qwen2.5:3b
  api_key_env: ""

filters:
  exclude_words: []
  min_likes: 0
  free_only: false

subscriptions:
  check_every_seconds: 60
  max_new_kept: 200

notify:
  kind: ""
  url: ""
  token_env: ""
  chat_id: ""
  open_url: http://127.0.0.1:8088

browser:
  headless: true
  executable_path: ""
  nav_timeout_seconds: 25

impersonate:
  target: chrome

sources:
  printables:
    enabled: true
    weight: 1.0
    mode: http

  makerworld:
    enabled: true
    weight: 1.0
    mode: link

  thingiverse:
    enabled: true
    weight: 0.8
    mode: http
    token_env: THINGIVERSE_TOKEN

  thangs:
    enabled: true
    weight: 0.7
    mode: link

  cults3d:
    enabled: true
    weight: 0.8
    mode: http
    user_env: CULTS3D_USER
    key_env: CULTS3D_API_KEY

  myminifactory:
    enabled: true
    weight: 0.8
    mode: http
    key_env: MMF_API_KEY

  searxng:
    enabled: false
    weight: 0.5
    url: "http://127.0.0.1:8089"
    sites:
      - grabcad.com
      - cgtrader.com
      - pinshape.com
      - free3d.com

custom_sources: {}

links:
  yeggi:
    label: Yeggi
    url: "https://www.yeggi.com/q/{q}/"
    color: "#ff9800"
  grabcad:
    label: GrabCAD
    url: "https://grabcad.com/library?query={q}"
    color: "#5c6bc0"
  cgtrader:
    label: CGTrader
    url: "https://www.cgtrader.com/3d-print-models?keywords={q}"
    color: "#26a69a"

# Внешний профиль: отдельный порт для доступа с других устройств — только поиск.
# Избранное, история, подписки, ключи и настройки остаются в админском профиле
# (http://127.0.0.1:8088), который всегда открывается только с этого компьютера.
# Настройки ниже меняются только здесь; после правки перезапустите modelseek.
public:
  enabled: false
  host: 0.0.0.0             # 0.0.0.0 — все сетевые адреса компьютера
  port: 8090
  # none — без входа; password — общий пароль; subnet — только из подсетей allow_from
  auth: none
  # Пускать только с этих адресов и подсетей (для любого auth). Пусто — откуда угодно
  allow_from: []            # например: [192.168.1.0/24, 10.8.0.0/24]
  # Переменная с паролем для auth: password. Задать можно в интерфейсе: Настройки → Сервер
  password_env: MODELSEEK_PUBLIC_PASSWORD
  searches_per_minute: 20   # поисков в минуту с одного адреса
  max_parallel_searches: 4  # одновременных поисков от всех гостей
  sources: []               # какие источники доступны гостям; пусто — все включённые
  allowed_hosts: []         # имена сайта, по которым пускать (Host); пусто — любые
  trusted_proxies: []       # адреса своего reverse proxy, чтобы видеть настоящий IP гостя
  source_url: ""            # ссылка на исходный код для гостей (AGPL); пусто — архив /source.zip
  # Гости ищут со своими ключами (вводят у себя в настройках). true — гость без своего ключа ищет с ключом владельца
  lend_keys: false
